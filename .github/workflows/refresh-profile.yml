name: Refresh public profile statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'
permissions:
  contents: write
concurrency:
  group: public-profile-statistics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate assets from public profile data
        run: python3 scripts/update_profile_assets.py
      - name: Commit changed public statistics
        run: |
          if ! git diff --quiet -- assets; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets
            git commit -m 'Refresh public GitHub profile statistics'
            git push
          fi
